sensors:
  - depth_camera_pointcloud
  - lidar_pointcloud

depth_camera_pointcloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /simple_arm/sensors/depth_camera/points
  max_range: 3.0
  point_subsample: 2
  padding_offset: 0.03
  padding_scale: 1.0
  max_update_rate: 3.0
  filtered_cloud_topic: /simple_arm/perception/depth_filtered

lidar_pointcloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /simple_arm/sensors/lidar/points
  max_range: 4.0
  point_subsample: 1
  padding_offset: 0.03
  padding_scale: 1.0
  max_update_rate: 2.0
  filtered_cloud_topic: /simple_arm/perception/lidar_filtered
